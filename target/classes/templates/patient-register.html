<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Register Patient</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">

<h2>Register Patient</h2>

<!-- th:object binds the form to the "patient" model attribute.
     th:field binds each input to the matching field of that object.
     The form is submitted via POST to /patients/register (chapter 13.1/13.4). -->
<form th:action="@{/patients/register}" th:object="${patient}" method="post" class="mt-3" style="max-width:400px">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <!-- "is-invalid" is added when the field has a validation error;
             the error message is shown by th:errors below (chapter 13.3). -->
        <input type="text" th:field="*{name}" class="form-control"
               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Birthdate</label>
        <input type="date" th:field="*{birthdate}" class="form-control"
               th:classappend="${#fields.hasErrors('birthdate')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{birthdate}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">SSN (000-00-0000)</label>
        <input type="number" th:field="*{ssn}" class="form-control" placeholder="1234567890"
               th:classappend="${#fields.hasErrors('ssn')} ? 'is-invalid'"/>
        <div class="invalid-feedback" th:errors="*{ssn}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
    <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
