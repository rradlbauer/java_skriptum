<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Vaccinations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">

<h2>Vaccinations — <span th:text="${patient.name}"></span></h2>
<p class="text-muted">
    Born: <span th:text="${patient.birthdate}"></span> &nbsp;|&nbsp;
    SSN: <span th:text="${patient.ssn}"></span>
</p>

<a th:href="@{/patients/{id}/vaccinations/add(id=${patient.id})}" class="btn btn-primary mb-3">Add Vaccination</a>
<a th:href="@{/patients}" class="btn btn-secondary mb-3">Back to Patients</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Agent</th>
            <th>Date</th>
            <th>Doctor</th>
        </tr>
    </thead>
    <tbody>
          <tr th:each="v : ${vaccinations}">
            <td th:text="${v.agent}"></td>
            <td th:text="${v.date}"></td>
            <td th:text="${v.doctor}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
