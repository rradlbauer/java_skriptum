<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Patients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">

<h2>Patients</h2>
<a th:href="@{/patients/register}" class="btn btn-primary mb-3">Register Patient</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Birthdate</th>
            <th>SSN</th>
            <th>Vaccinations</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.birthdate}"></td>
            <td th:text="${p.ssn}"></td>
            <td>
                <a th:href="@{/patients/{id}/vaccinations(id=${p.id})}" class="btn btn-sm btn-outline-secondary">
                    View (<span th:text="${p.vaccinations.size()}"></span>)
                </a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
